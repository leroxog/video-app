# Satürn on Fly.io (see deploy/FLY_ANLEITUNG.md). The name of the app is chosen with "fly launch --name ...".
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"       # the site stays on all the time (the AI services and the notifications need it)
  auto_start_machines = true
  min_machines_running = 1
  [http_service.concurrency]
    type = "requests"
    soft_limit = 60
    hard_limit = 120

  [[http_service.checks]]
    grace_period = "40s"
    interval = "30s"
    method = "GET"
    path = "/"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
