{% extends "cheaper_base.html" %}
{% block title %}Code eingeben - Cheaper{% endblock %}
{% block content %}
<div class="cheaper-auth-page">
    <h1>Code eingeben</h1>
    <p class="cheaper-form-hint" style="margin-bottom:16px;">Gib den 6-stelligen Code ein, den du erhalten hast (gültig für 15 Minuten), und wähle ein neues Passwort.</p>
    <form action="{{ url_for('forgot_password_verify') }}" method="post" class="cheaper-form">
        <label for="username">Benutzername (nur nötig, wenn dir ein Admin den Code manuell mitgeteilt hat)
            <input type="text" id="username" name="username" maxlength="50">
        </label>
        <label for="code">Code
            <input type="text" id="code" name="code" required maxlength="6" inputmode="numeric" autocomplete="one-time-code">
        </label>
        <label for="new_password">Neues Passwort
            <input type="password" id="new_password" name="new_password" required>
        </label>
        <label for="new_password2">Neues Passwort wiederholen
            <input type="password" id="new_password2" name="new_password2" required>
        </label>
        <button type="submit" class="cheaper-btn">Passwort ändern</button>
    </form>
    <form action="{{ url_for('forgot_password_verify') }}" method="post" style="margin-top:14px;">
        <input type="hidden" name="action" value="resend">
        <button type="submit" class="cheaper-btn secondary">Neuen Code senden</button>
    </form>
</div>
{% endblock %}
