{% extends "pl_base.html" %}
{% set active = 'nex7' %}
{% block title %}Nex7 · pinklemon{% endblock %}

{% block head_extra %}
<style>
  .pl-screen.nex7 { display: flex; flex-direction: column; padding-bottom: calc(150px + env(safe-area-inset-bottom,0px)); }
  .n7-persona-row { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 12px; scrollbar-width: none; flex-shrink: 0; }
  .n7-persona-row::-webkit-scrollbar { display: none; }
  .n7-chip {
    flex: 0 0 auto; border: 1px solid var(--pl-border); background: var(--pl-surface-2);
    color: var(--pl-text-dim); border-radius: 999px; padding: 9px 16px; font-size: 13px; font-weight: 800;
  }
  .n7-chip.active { background: var(--pl-pink); color: #fff; border-color: var(--pl-pink); }
  .n7-chip:active { transform: scale(0.95); }
  .n7-desc {
    background: var(--pl-surface-2); border: 1px solid var(--pl-border); border-radius: var(--pl-r-md);
    padding: 10px 14px; font-size: 12.5px; color: var(--pl-text-dim); margin-bottom: 12px; line-height: 1.45;
  }
  .n7-desc b { color: var(--pl-pink); }
  .n7-msgs { flex: 1; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; }
  .n7-msg { max-width: 82%; padding: 10px 14px; border-radius: var(--pl-r-md); font-size: 14px; line-height: 1.45; white-space: pre-wrap; word-break: break-word; }
  .n7-msg.them { align-self: flex-start; background: var(--pl-surface-2); border: 1px solid var(--pl-border); border-bottom-left-radius: 6px; }
  .n7-msg.me { align-self: flex-end; background: var(--pl-pink); color: #fff; border-bottom-right-radius: 6px; }
  .n7-msg.think { align-self: flex-start; color: var(--pl-text-faint); font-style: italic; background: none; border: none; }
  .n7-compose {
    position: absolute; left: 12px; right: 12px; bottom: calc(80px + env(safe-area-inset-bottom,0px));
    display: flex; gap: 8px; background: var(--pl-surface); border: 1px solid var(--pl-border);
    border-radius: 999px; padding: 8px 8px 8px 16px; box-shadow: var(--pl-shadow); z-index: 30;
  }
  .n7-compose input { flex: 1; min-width: 0; border: none; background: transparent; outline: none; font-size: 14px; color: var(--pl-text); }
  .n7-compose button { flex-shrink: 0; width: 42px; height: 42px; border-radius: 50%; border: none; background: var(--pl-pink); color: #fff; display: flex; align-items: center; justify-content: center; }
</style>
{% endblock %}

{% block screen %}
<div class="pl-screen-head"><h1>Nex7</h1></div>
<div class="n7-persona-row" id="n7Chips">
    {% for p in personas %}
    <button class="n7-chip {{ 'active' if p.key == current_persona }}" data-key="{{ p.key }}" data-pt="{{ '' if p.key == 'nex' else (p.key if p.key != 'seven' else 'sevenai') }}">{{ p.name }}</button>
    {% endfor %}
</div>
<div class="n7-desc" id="n7Desc"></div>
<div class="n7-msgs" id="n7Msgs"></div>
{% endblock %}

{% block sheets %}
<div class="n7-compose">
    <input type="text" id="n7Input" maxlength="2000" placeholder="Schreib deiner Ai …" autocomplete="off">
    <button id="n7Send" aria-label="Senden"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg></button>
</div>
{% endblock %}

{% block scripts %}
<script>
  window.PL_ME = {{ me_json | tojson }};
  window.N7 = {
    persona: {{ current_persona | tojson }},
    projectType: {{ project_type | tojson }},
    personas: {{ personas | tojson }},
  };
</script>
<script src="{{ url_for('static', filename='js/pinklemon-nex7.js') }}"></script>
{% endblock %}
