{% extends "cheaper_base.html" %}
{% block title %}Passwort vergessen - Cheaper{% endblock %}
{% block content %}
<div class="cheaper-auth-page">
    <h1>Passwort oder Benutzername vergessen</h1>
    <p class="cheaper-form-hint" style="margin-bottom:16px;">Hast du eine E-Mail-Adresse bei deinem Konto hinterlegt?</p>
    <div style="display:flex;gap:10px;">
        <a class="cheaper-btn" href="{{ url_for('forgot_password_email') }}">Ja</a>
        <a class="cheaper-btn secondary" href="{{ url_for('forgot_password_help') }}">Nein</a>
    </div>
</div>
{% endblock %}
