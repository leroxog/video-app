{% extends "cheaper_base.html" %}
{% block title %}Login - Cheaper{% endblock %}
{% block content %}
<div class="cheaper-auth-page">
    <h1>Willkommen zurück</h1>
    <p class="cheaper-form-hint" style="margin-bottom:16px;">Dein LEROX-Konto -- gilt für alle Projekte auf <a href="{{ url_for('studio_home') }}">LEROX STUDIO</a>.</p>
    <form action="{{ url_for('login') }}" method="post" class="cheaper-form">
        <label for="username">Benutzername
            <input type="text" id="username" name="username" required maxlength="50">
        </label>
        <label for="password">Passwort
            <input type="password" id="password" name="password" required>
        </label>
        <button type="submit" class="cheaper-btn">Einloggen</button>
    </form>
    <p class="cheaper-auth-footer"><a href="{{ url_for('forgot_password') }}">Passwort oder Benutzername vergessen?</a></p>
    <p class="cheaper-auth-footer">Noch kein Konto? <a href="{{ url_for('register') }}">Registrieren</a></p>
    <p class="cheaper-auth-footer"><a href="{{ url_for('register_company') }}">Firmenkonto erstellen &rarr;</a></p>
</div>
{% endblock %}
