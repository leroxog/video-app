<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Offline</title>
    <style>
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
               background: #0a0a0c; color: #f1f1f1; font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
        .box { text-align: center; padding: 32px; max-width: 420px; }
        h1 { font-size: 20px; font-weight: 700; margin: 0 0 10px; }
        p { font-size: 14px; color: #aaa; line-height: 1.5; margin: 0; }
    </style>
</head>
<body>
    <div class="box">
        <h1>Keine Verbindung</h1>
        <p>Du bist gerade offline. Sobald du wieder online bist, funktioniert alles normal.</p>
    </div>
</body>
</html>
