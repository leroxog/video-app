<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1cb0f6">
<title>{{ title }} | gomat</title>
<link rel="icon" href="{{ static_url('img/gomat-icon.svg') }}" type="image/svg+xml">
<link rel="stylesheet" href="{{ static_url('css/gomat.css') }}">
</head>
<body>
<main class="errorpage">
  <img src="{{ static_url('img/gomi-' ~ mood ~ '.svg') if mood != 'happy' else static_url('img/gomi.svg') }}" alt="" width="170" height="170">
  <p class="code">{{ code }}</p>
  <h1>{{ title }}</h1>
  <p>{{ text }}</p>
  <a class="btn btn-primary" href="/">Zur Startseite</a>
</main>
</body>
</html>
