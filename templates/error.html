<!doctype html>
<html lang="de" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{ title }} | Satürn</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark light">
<link rel="icon" href="{{ static_url('img/saturn-tab.png') }}" type="image/png" sizes="256x256">
<link rel="icon" href="{{ static_url('img/pulse-192.png') }}" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="{{ static_url('img/pulse-180.png') }}">
<link rel="stylesheet" href="{{ static_url('css/yipi.css') }}">
<script src="{{ static_url('js/yipi-theme.js') }}"></script>
</head>
<body>
<main class="error-page">
  <a class="legal-logo" href="/" aria-label="Satürn, zur Startseite">{% include "partials/_pulse_mark.html" %}<span>Satürn</span></a>
  <p class="error-code">{{ code }}</p>
  <h1>{{ title }}</h1>
  <p class="muted">{{ text }}</p>
  <a class="btn primary" href="/">Zur Startseite</a>
</main>
</body>
</html>
