<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{ title }} | NSTL</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#212121" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="color-scheme" content="dark light">
<link rel="icon" href="{{ static_url('img/nstl-icon.svg') }}" type="image/svg+xml">
<link rel="icon" href="{{ static_url('img/nstl-192.png') }}" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="{{ static_url('img/nstl-180.png') }}">
<link rel="stylesheet" href="{{ static_url('css/regal.css') }}">
</head>
<body>
<main class="error-page">
  <a class="legal-logo" href="/" aria-label="NSTL, zur Startseite">{% include "partials/_nstl_mark.html" %}<span>NSTL</span></a>
  <p class="error-code">{{ code }}</p>
  <h1>{{ title }}</h1>
  <p class="muted">{{ text }}</p>
  <a class="btn primary" href="/">Zur Startseite</a>
</main>
</body>
</html>
