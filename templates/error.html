<!doctype html>
<html lang="de" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{ title }} | Treff</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b0f17">
<meta name="color-scheme" content="dark light">
<link rel="icon" href="{{ static_url('img/treff-icon.svg') }}" type="image/svg+xml">
<link rel="icon" href="{{ static_url('img/treff-192.png') }}" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="{{ static_url('img/treff-180.png') }}">
<link rel="stylesheet" href="{{ static_url('css/treff.css') }}">
</head>
<body>
<main class="error-page">
  <a class="legal-logo" href="/" aria-label="Treff, zur Startseite"><svg viewBox="0 0 48 48" aria-hidden="true" focusable="false"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#22d3ee"/></linearGradient></defs><rect x="2" y="2" width="44" height="44" rx="12" fill="url(#lg)"/><path d="M13 12h22a3 3 0 013 3v12a3 3 0 01-3 3H25l-7 6v-6h-5a3 3 0 01-3-3V15a3 3 0 013-3z" fill="#fff"/><path d="M24 17.500v6" stroke="#0b0f17" stroke-width="3" stroke-linecap="round"/><circle cx="24" cy="27.200" r="1.900" fill="#0b0f17"/></svg><span>Treff</span></a>
  <p class="error-code">{{ code }}</p>
  <h1>{{ title }}</h1>
  <p class="muted">{{ text }}</p>
  <a class="btn primary" href="/">Zur Startseite</a>
</main>
</body>
</html>
