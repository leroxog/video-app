<!doctype html>
<html lang="de" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{ title }} | raumo</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0c0d10">
<meta name="color-scheme" content="dark">
<link rel="icon" href="{{ static_url('img/raumo-icon.svg') }}" type="image/svg+xml">
<link rel="icon" href="{{ static_url('img/raumo-192.png') }}" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="{{ static_url('img/raumo-180.png') }}">
<link rel="stylesheet" href="{{ static_url('css/raumo.css') }}">
</head>
<body>
<main class="error-page">
  <a class="legal-logo" href="/" aria-label="raumo, zur Startseite"><svg viewBox="0 0 48 48" aria-hidden="true" focusable="false"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff8a1f"/><stop offset="1" stop-color="#ffcf3a"/></linearGradient></defs><path d="M6 15V9a3 3 0 013-3h6M33 6h6a3 3 0 013 3v6M42 33v6a3 3 0 01-3 3h-6M15 42H9a3 3 0 01-3-3v-6" fill="none" stroke="url(#lg)" stroke-width="3.4" stroke-linecap="round"/><path d="M24 13l9.500 5.300v10.600L24 34.300l-9.500-5.400V18.300z" fill="url(#lg)"/><path d="M24 23.600l9.500-5.300M24 23.600v10.700M24 23.600l-9.500-5.300" fill="none" stroke="#1a1204" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" opacity=".55"/></svg><span>raumo</span></a>
  <p class="error-code">{{ code }}</p>
  <h1>{{ title }}</h1>
  <p class="muted">{{ text }}</p>
  <a class="btn primary" href="/">Zur Startseite</a>
</main>
</body>
</html>
