{% extends "base.html" %}
{% block title %}{{ project.name }} - NAIL{% endblock %}
{% block content %}
    <div class="nail-play-page">
        <div class="nail-play-header">
            <a href="{{ url_for('nail_page') }}">&larr; NAIL</a>
            <h1>{{ project.name }}</h1>
            <span class="nail-play-author">von {{ project.owner.username }}</span>
        </div>

        <div class="nail-editor-page" id="nailEditorPage" data-project-id="{{ project.id }}"
             data-project-json="{{ project.project_json|e }}" data-read-only="true"
             data-username="{{ user.username if user else '' }}">
            <div class="nail-stage-col nail-stage-col-solo">
                <div class="nail-stage-header">
                    <button type="button" id="nailGreenFlag" class="nail-flag-btn" title="Starten">⚑</button>
                    <button type="button" id="nailStopBtn" class="nail-stop-btn-stage" title="Stoppen">⬤</button>
                </div>
                <div class="nail-stage" id="nailStage">
                    <div class="nail-speech-bubble" id="nailSpeechBubble" style="display:none;"></div>
                    <div class="nail-sprite" id="nailSprite">{% include "partials/_nail_robot_sprite.html" %}</div>
                </div>
            </div>
            <div class="nail-palette" id="nailPalette" hidden></div>
            <div class="nail-canvas" id="nailCanvas" hidden></div>
            <div class="nail-category-rail" id="nailCategoryList" hidden></div>
        </div>

        {% if user %}
            <button type="button" class="nail-like-btn {{ 'is-liked' if has_liked else '' }}" id="nailLikeBtn" data-project-id="{{ project.id }}">
                <span aria-hidden="true">&hearts;</span> <span id="nailLikeCount">{{ like_count }}</span>
            </button>
        {% endif %}
    </div>

    <script src="{{ url_for('static', filename='js/nail-blocks.js') }}"></script>
    <script src="{{ url_for('static', filename='js/nail-runtime.js') }}"></script>
    <script src="{{ url_for('static', filename='js/nail-editor.js') }}"></script>
    <script>
        const nailLikeBtn = document.getElementById("nailLikeBtn");
        if (nailLikeBtn) {
            nailLikeBtn.addEventListener("click", () => {
                fetch(`/api/nail/${nailLikeBtn.dataset.projectId}/like`, { method: "POST" })
                    .then((res) => res.json())
                    .then((data) => {
                        if (!data.ok) return;
                        nailLikeBtn.classList.toggle("is-liked", data.liked);
                        document.getElementById("nailLikeCount").textContent = data.like_count;
                    })
                    .catch(() => {});
            });
        }
    </script>
{% endblock %}
