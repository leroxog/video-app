{% extends "pl_base.html" %}
{% block title %}ylib{% endblock %}

{% block head_extra %}
<style>
  .pl-screen.ylib { padding: 0; align-items: stretch; display: flex; flex-direction: column; background: var(--pl-bg); }

  .yl-top {
    display: flex; align-items: center; gap: 10px; padding: 12px 18px; flex-shrink: 0;
    background: var(--pl-surface); border-bottom: 1px solid var(--pl-border);
  }
  .yl-top .logo { font-size: 19px; font-weight: 800; letter-spacing: -.02em; color: var(--pl-text); flex: 1; }
  .yl-top .logo span { color: #17b897; }
  .yl-upload-btn {
    display: inline-flex; align-items: center; gap: 6px; border: none; background: #17b897; color: #fff;
    font-size: 12.5px; font-weight: 700; padding: 8px 16px; border-radius: 999px; cursor: pointer;
  }
  .yl-upload-btn:disabled { opacity: .55; cursor: default; }
  .yl-upload-btn svg { width: 15px; height: 15px; }
  .yl-logout { border: none; background: none; color: var(--pl-text-faint); font-size: 12.5px; font-weight: 600; }
  .yl-logout:hover { color: var(--pl-text); }

  .yl-body { flex: 1; min-height: 0; overflow-y: auto; }
  .yl-main { max-width: 1180px; margin: 0 auto; padding: 22px 18px 60px; }

  .yl-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 18px 16px;
  }
  .yl-card {
    background: var(--pl-surface); border: 1px solid var(--pl-border); border-radius: 14px;
    overflow: hidden; cursor: pointer; position: relative; transition: transform .15s ease, box-shadow .15s ease;
  }
  .yl-card:hover { transform: translateY(-3px); box-shadow: 0 10px 24px rgba(0,0,0,.16); }
  .yl-thumb {
    width: 100%; aspect-ratio: 16/9; background: var(--pl-surface-2); display: flex;
    align-items: center; justify-content: center; overflow: hidden; position: relative;
  }
  .yl-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .yl-thumb.is-video { background: linear-gradient(145deg, #1c2333, #0f131c); }
  .yl-thumb.is-video svg { width: 46px; height: 46px; color: rgba(255,255,255,.92); }
  .yl-badge {
    position: absolute; right: 8px; bottom: 8px; background: rgba(0,0,0,.72); color: #fff;
    font-size: 10.5px; font-weight: 700; letter-spacing: .03em; padding: 3px 7px; border-radius: 5px;
    text-transform: uppercase;
  }
  .yl-info { padding: 10px 12px 12px; }
  .yl-info .title {
    font-size: 13.5px; font-weight: 700; color: var(--pl-text); line-height: 1.35;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .yl-info .meta { font-size: 12px; color: var(--pl-text-faint); margin-top: 5px; }
  .yl-del {
    position: absolute; top: 8px; right: 8px; width: 28px; height: 28px; border-radius: 8px;
    border: none; background: rgba(0,0,0,.55); color: #fff; display: flex; align-items: center;
    justify-content: center; opacity: 0; transition: opacity .12s ease, background .12s ease;
  }
  .yl-card:hover .yl-del { opacity: 1; }
  .yl-del:hover { background: var(--pl-danger); }
  .yl-del svg { width: 15px; height: 15px; }

  .yl-empty { text-align: center; color: var(--pl-text-faint); font-size: 13.5px; padding: 70px 10px; }
  .yl-empty svg { width: 40px; height: 40px; margin-bottom: 10px; color: var(--pl-text-faint); }

  .yl-uploading {
    display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 8px;
    color: var(--pl-text-faint); font-size: 12px; font-weight: 600;
  }
  .yl-spin {
    width: 22px; height: 22px; border-radius: 50%; border: 2.5px solid var(--pl-border);
    border-top-color: #17b897; animation: yl-spin .7s linear infinite;
  }
  @keyframes yl-spin { to { transform: rotate(360deg); } }

  /* Player / detail view */
  .yl-player { display: none; max-width: 920px; margin: 0 auto; padding: 18px 18px 60px; }
  .yl-player.active { display: block; }
  .yl-body.in-player .yl-grid-wrap { display: none; }
  .yl-back {
    display: inline-flex; align-items: center; gap: 6px; border: none; background: none;
    color: var(--pl-text-dim); font-size: 13px; font-weight: 600; margin-bottom: 14px; cursor: pointer;
  }
  .yl-back:hover { color: var(--pl-text); }
  .yl-back svg { width: 16px; height: 16px; }
  .yl-stage {
    width: 100%; border-radius: 14px; overflow: hidden; background: #000;
    display: flex; align-items: center; justify-content: center;
  }
  .yl-stage img { width: 100%; max-height: 70vh; object-fit: contain; display: block; }
  .yl-stage video { width: 100%; max-height: 70vh; display: block; }
  .yl-player-title { font-size: 17px; font-weight: 800; color: var(--pl-text); margin: 16px 0 4px; }
  .yl-player-meta { font-size: 12.5px; color: var(--pl-text-faint); }
</style>
{% endblock %}

{% block screen_class %}ylib{% endblock %}
{% block screen %}
<div class="yl-top">
  <div class="logo">y<span>lib</span></div>
  <button type="button" class="yl-upload-btn" id="ylUploadBtn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v13m0-13 5 5m-5-5-5 5M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
    Hochladen
  </button>
  <a class="yl-logout" href="/logout">Abmelden</a>
</div>
<input type="file" id="ylFileInput" accept="image/png,image/jpeg,image/gif,image/webp,video/mp4,video/webm,video/ogg,video/quicktime" hidden>
<div class="yl-body" id="ylBody">
  <div class="yl-grid-wrap">
    <div class="yl-main">
      <div class="yl-grid" id="ylGrid"></div>
    </div>
  </div>
  <div class="yl-player" id="ylPlayer">
    <button type="button" class="yl-back" id="ylBackBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
      Zurück
    </button>
    <div class="yl-stage" id="ylStage"></div>
    <div class="yl-player-title" id="ylPlayerTitle"></div>
    <div class="yl-player-meta" id="ylPlayerMeta"></div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/pinklemon-ylib.js') }}"></script>
{% endblock %}
