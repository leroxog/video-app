{% extends "pl_base.html" %}
{% set active = 'nex' %}
{% block title %}Nex · pinklemon{% endblock %}

{% block head_extra %}
<style>
  .pl-screen.nex { padding: 0; align-items: stretch; }
  .nx-orb { flex: 1; position: relative; overflow: hidden; }
  #nxCanvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: manipulation; }

  .nx-heard {
    position: absolute; left: 22px; right: 22px; top: 24px; z-index: 3; text-align: center;
    font-size: 14.5px; font-style: italic; color: var(--pl-text);
    opacity: 0; transform: translateY(-6px); transition: opacity .3s, transform .3s; pointer-events: none;
  }
  .nx-heard.show { opacity: .9; transform: none; }

  .nx-status {
    position: absolute; left: 0; right: 0; bottom: calc(172px + env(safe-area-inset-bottom, 0px));
    z-index: 3; text-align: center; font-size: 13.5px; font-weight: 700; letter-spacing: .02em;
    color: var(--pl-text-dim); pointer-events: none;
  }

  .nx-controls {
    position: absolute; left: 0; right: 0; bottom: calc(92px + env(safe-area-inset-bottom, 0px));
    z-index: 4; display: flex; align-items: center; justify-content: center; gap: 18px;
  }
  @media (min-width: 900px) {
    .nx-status { bottom: 120px; }
    .nx-controls { bottom: 34px; }
  }
  .nx-mic {
    width: 74px; height: 74px; border-radius: 50%; border: none; background: var(--pl-pink); color: #fff;
    display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 34px rgba(255, 45, 149, .5);
    transition: transform .12s ease;
  }
  .nx-mic:active { transform: scale(.92); }
  .nx-mic.listening { background: #fff; color: var(--pl-pink); animation: nxPulse 1.5s ease-out infinite; }
  @keyframes nxPulse {
    0% { box-shadow: 0 0 0 0 rgba(255, 45, 149, .55); }
    70% { box-shadow: 0 0 0 22px rgba(255, 45, 149, 0); }
    100% { box-shadow: 0 0 0 0 rgba(255, 45, 149, 0); }
  }
  .nx-kb {
    width: 50px; height: 50px; border-radius: 50%; border: 1px solid var(--pl-border);
    background: var(--pl-surface-2); color: var(--pl-text); display: flex; align-items: center; justify-content: center;
    -webkit-backdrop-filter: var(--pl-blur); backdrop-filter: var(--pl-blur);
  }
  .nx-kb:active { transform: scale(.9); }

  .nx-typerow {
    position: absolute; left: 12px; right: 12px; bottom: calc(92px + env(safe-area-inset-bottom, 0px));
    z-index: 6; display: none; gap: 8px; align-items: center;
    background: var(--pl-surface-2); border: 1px solid var(--pl-border); border-radius: 26px; padding: 7px 7px 7px 16px;
    -webkit-backdrop-filter: var(--pl-blur); backdrop-filter: var(--pl-blur); box-shadow: var(--pl-shadow);
  }
  .nx-typerow.show { display: flex; }
  .nx-typerow input {
    flex: 1; min-width: 0; border: none; background: transparent; outline: none; color: var(--pl-text); font-size: 14.5px;
  }
  .nx-typerow button {
    flex-shrink: 0; width: 40px; height: 40px; border-radius: 50%; border: none; background: var(--pl-pink); color: #fff;
    display: flex; align-items: center; justify-content: center;
  }
  @media (min-width: 900px) { .nx-typerow { left: 254px; right: 24px; bottom: 28px; } }
</style>
{% endblock %}

{% block screen_class %}nex{% endblock %}
{% block screen %}
  <div class="nx-orb" id="nxOrb">
    <canvas id="nxCanvas"></canvas>
    <div class="nx-heard" id="nxHeard"></div>
    <div class="nx-status" id="nxStatus">Tipp den Kreis und red mit Nex</div>
    <div class="nx-controls">
      <button class="nx-mic" id="nxMic" aria-label="Mit Nex reden">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0"/><path d="M12 19v3"/></svg>
      </button>
      <button class="nx-kb" id="nxKb" aria-label="Tippen">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="3"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M8 14h8"/></svg>
      </button>
    </div>
    <div class="nx-typerow" id="nxTypeRow">
      <input id="nxTypeInput" maxlength="2000" placeholder="An Nex schreiben" autocomplete="off">
      <button id="nxTypeSend" aria-label="Senden">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg>
      </button>
    </div>
  </div>
{% endblock %}

{% block scripts %}
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
  window.PL_ME = {{ me_json | tojson }};
  window.NEX = { projectType: {{ project_type | tojson }}, character: {{ chat_character | tojson }} };
</script>
<script src="{{ url_for('static', filename='js/pinklemon-nex.js') }}"></script>
{% endblock %}
