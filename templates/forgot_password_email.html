{% extends "cheaper_base.html" %}
{% block title %}Passwort vergessen - Chepal{% endblock %}
{% block content %}
<div class="cheaper-auth-page">
    <h1>Code per E-Mail anfordern</h1>
    <p class="cheaper-form-hint" style="margin-bottom:16px;">Gib die E-Mail-Adresse an, die du bei deinem Konto hinterlegt hast. Wir schicken dir einen 6-stelligen Code.</p>
    <form action="{{ url_for('forgot_password_email') }}" method="post" class="cheaper-form">
        <label for="email">E-Mail-Adresse
            <input type="email" id="email" name="email" required maxlength="255">
        </label>
        <button type="submit" class="cheaper-btn">Code senden</button>
    </form>
</div>
{% endblock %}
