<!doctype html>
<html lang="de" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{ title }} | yipi</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark light">
<link rel="icon" href="{{ static_url('img/yipi-icon.svg') }}" type="image/svg+xml">
<link rel="icon" href="{{ static_url('img/yipi-192.png') }}" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="{{ static_url('img/yipi-180.png') }}">
<link rel="stylesheet" href="{{ static_url('css/yipi.css') }}">
<script src="{{ static_url('js/yipi-theme.js') }}"></script>
</head>
<body>
<main class="error-page">
  <a class="legal-logo" href="/" aria-label="yipi, zur Startseite">
    <svg viewBox="0 0 64 64" aria-hidden="true" focusable="false"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b6cff"/><stop offset="1" stop-color="#ff4f9a"/></linearGradient></defs><path d="M32 5C16.500 5 5 15.500 5 29.500c0 13.500 10.700 23.500 25.500 23.500 3.300 0 6.300-.5 9-1.500L53 59l-2.800-12C55.800 42.800 59 36.500 59 29.500 59 15.500 47.500 5 32 5z" fill="url(#lg)"/><path d="M20 21l12 14 12-14M32 35l-7 13" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span>yipi</span>
  </a>
  <p class="error-code">{{ code }}</p>
  <h1>{{ title }}</h1>
  <p class="muted">{{ text }}</p>
  <a class="btn primary" href="/">Zur Startseite</a>
</main>
</body>
</html>
