{% extends "pl_base.html" %}
{% block title %}NRS{% endblock %}

{% block head_extra %}
<style>
  /* A plain client-side iframe browser -- no server-side proxying of any
     kind. Every request a loaded page makes still goes directly from the
     visitor's own browser to that page's own server, exactly like typing
     the URL into a normal browser tab would; this app never sees or
     relays that traffic. That also means a site's own X-Frame-Options/
     CSP frame-ancestors rule still applies normally and can refuse to
     display here -- there's no reliable way to detect that from outside
     a cross-origin frame (contentDocument reads back null for a blocked
     frame AND a perfectly successful cross-origin one alike, so it can't
     tell the two apart), hence the always-available "open in a real tab"
     button in the bar instead of trying to guess when to show it. */
  .pl-screen.nrs { padding: 0; align-items: stretch; display: flex; flex-direction: column; background: var(--pl-bg); }

  .nrs-tabstrip {
    display: flex; align-items: flex-end; gap: 2px; padding: 6px 6px 0; flex-shrink: 0;
    background: var(--pl-bg-2); overflow-x: auto;
  }
  .nrs-tab {
    display: flex; align-items: center; gap: 6px; max-width: 180px; min-width: 120px;
    padding: 8px 6px 8px 12px; border-radius: 10px 10px 0 0; cursor: pointer; flex-shrink: 0;
    background: var(--pl-bg-2); color: var(--pl-text-faint); font-size: 12.5px; white-space: nowrap;
    border: 1px solid transparent; border-bottom: none;
  }
  .nrs-tab.is-active { background: var(--pl-surface); color: var(--pl-text); border-color: var(--pl-border); }
  .nrs-tab-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .nrs-tab-close {
    flex-shrink: 0; width: 18px; height: 18px; border-radius: 5px; border: none; background: transparent;
    color: inherit; display: flex; align-items: center; justify-content: center; opacity: .65;
  }
  .nrs-tab-close:hover { background: var(--pl-hover); opacity: 1; }
  .nrs-tab-close svg { width: 12px; height: 12px; }
  .nrs-tab-add {
    flex-shrink: 0; width: 30px; height: 30px; margin-bottom: 2px; border-radius: 8px; border: none;
    background: transparent; color: var(--pl-text-faint); font-size: 19px; line-height: 1;
    display: flex; align-items: center; justify-content: center;
  }
  .nrs-tab-add:hover { background: var(--pl-hover); color: var(--pl-text); }

  .nrs-bar {
    display: flex; align-items: center; gap: 8px; padding: 10px 14px; flex-shrink: 0;
    background: var(--pl-surface); border-bottom: 1px solid var(--pl-border);
  }
  .nrs-nav-btn {
    flex-shrink: 0; border: none; background: transparent; color: var(--pl-text-dim);
    width: 34px; height: 34px; border-radius: 8px; display: flex; align-items: center; justify-content: center;
  }
  .nrs-nav-btn:hover:not(:disabled) { background: var(--pl-hover); color: var(--pl-text); }
  .nrs-nav-btn:disabled { opacity: .35; }
  .nrs-nav-btn svg { width: 18px; height: 18px; }
  .nrs-address-form { flex: 1; display: flex; min-width: 0; }
  .nrs-address {
    flex: 1; min-width: 0; border: 1px solid var(--pl-border); background: var(--pl-bg-2); color: var(--pl-text);
    border-radius: 999px; padding: 9px 16px; font-size: 14px; font-family: inherit;
  }
  .nrs-address:focus { outline: none; border-color: var(--pl-pink); }
  .nrs-go-btn {
    flex-shrink: 0; margin-left: 8px; border: none; background: var(--pl-pink); color: #fff;
    font-weight: 700; font-size: 13.5px; padding: 0 18px; border-radius: 999px;
  }

  .nrs-body { flex: 1; min-height: 0; position: relative; }
  .nrs-tab-pane { position: absolute; inset: 0; }
  .nrs-tab-pane[hidden] { display: none; }
  .nrs-frame { width: 100%; height: 100%; border: none; background: #fff; }
  .nrs-home {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 16px; color: var(--pl-text-dim); text-align: center; padding: 24px;
  }
  .nrs-home-mark { width: 56px; height: 56px; }
  .nrs-home-mark svg { width: 100%; height: 100%; display: block; }
  .nrs-home h1 { margin: 0; font-size: 22px; color: var(--pl-text); }
  .nrs-home p { margin: 0; max-width: 380px; font-size: 13.5px; line-height: 1.5; }

  .nrs-history-backdrop {
    position: fixed; inset: 0; z-index: 59; background: rgba(0, 0, 0, .4);
    opacity: 0; pointer-events: none; transition: opacity .2s ease;
  }
  .nrs-history-backdrop.open { opacity: 1; pointer-events: auto; }
  .nrs-history-panel {
    position: fixed; top: 0; right: 0; bottom: 0; width: 320px; max-width: 88vw; z-index: 60;
    background: var(--pl-surface); border-left: 1px solid var(--pl-border);
    display: flex; flex-direction: column; transform: translateX(100%); transition: transform .2s ease;
  }
  .nrs-history-panel.open { transform: translateX(0); }
  .nrs-history-top {
    display: flex; align-items: center; gap: 8px; padding: 10px 12px; flex-shrink: 0;
    border-bottom: 1px solid var(--pl-border);
  }
  .nrs-history-title { flex: 1; font-weight: 700; font-size: 14px; color: var(--pl-text); }
  .nrs-history-list { flex: 1; overflow-y: auto; padding: 8px; }
  .nrs-history-row { display: flex; flex-direction: column; gap: 2px; padding: 9px 10px; border-radius: 10px; cursor: pointer; }
  .nrs-history-row:hover { background: var(--pl-hover); }
  .nrs-history-row-title {
    font-size: 13px; color: var(--pl-text); font-weight: 600;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .nrs-history-row-url {
    font-size: 11.5px; color: var(--pl-text-faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .nrs-history-empty { padding: 24px 14px; color: var(--pl-text-faint); font-size: 13px; text-align: center; }
  .nrs-history-clear {
    margin: 8px 12px 12px; flex-shrink: 0; border: 1px solid var(--pl-border); background: var(--pl-surface-2);
    color: var(--pl-text); border-radius: 10px; padding: 9px 12px; font-size: 12.5px; font-weight: 600;
  }
  .nrs-history-clear:hover { background: var(--pl-hover); }

  /* ---------------- mini-site builder -- users write a small self-
     contained HTML/CSS/JS snippet and give it a made-up "<slug>.nrs"
     address, typeable into NRS's own address bar. Not a real TLD, not
     real hosting -- a small closed "build your own site" feature. */
  .nrs-create-fab {
    position: absolute; right: 20px; bottom: 20px; z-index: 20;
    width: 52px; height: 52px; border-radius: 50%; border: none;
    background: var(--pl-pink); color: #fff; font-size: 28px; font-weight: 400; line-height: 1;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 6px 20px rgba(0, 0, 0, .3);
  }
  .nrs-create-fab:hover { filter: brightness(1.08); }

  .nrs-create-backdrop {
    position: fixed; inset: 0; z-index: 69; background: rgba(0, 0, 0, .45);
    opacity: 0; pointer-events: none; transition: opacity .2s ease;
  }
  .nrs-create-backdrop.open { opacity: 1; pointer-events: auto; }
  .nrs-create-modal {
    position: fixed; z-index: 70; left: 50%; top: 50%; width: 520px; max-width: 92vw;
    max-height: 86vh; background: var(--pl-surface); border: 1px solid var(--pl-border);
    border-radius: 16px; box-shadow: var(--pl-shadow);
    display: flex; flex-direction: column;
    transform: translate(-50%, -50%) scale(.96); opacity: 0; pointer-events: none;
    transition: transform .15s ease, opacity .15s ease;
  }
  .nrs-create-modal.open { transform: translate(-50%, -50%) scale(1); opacity: 1; pointer-events: auto; }
  .nrs-create-top {
    display: flex; align-items: center; gap: 8px; padding: 12px 14px; flex-shrink: 0;
    border-bottom: 1px solid var(--pl-border);
  }
  .nrs-create-title { flex: 1; font-weight: 700; font-size: 15px; color: var(--pl-text); }
  .nrs-create-body { flex: 1; min-height: 0; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .nrs-create-body label { font-size: 12px; font-weight: 700; color: var(--pl-text-faint); text-transform: uppercase; letter-spacing: .03em; }
  .nrs-create-body input, .nrs-create-body textarea {
    border: 1px solid var(--pl-border); background: var(--pl-bg-2); color: var(--pl-text);
    border-radius: 10px; padding: 9px 12px; font-size: 13.5px; font-family: inherit;
  }
  .nrs-create-body textarea {
    min-height: 160px; resize: vertical; font-family: "Consolas", "SF Mono", ui-monospace, monospace; font-size: 12.5px;
  }
  .nrs-create-domain-row { display: flex; align-items: center; gap: 8px; }
  .nrs-create-domain-row input { flex: 1; min-width: 0; }
  .nrs-create-domain-row span { color: var(--pl-text-dim); font-size: 13.5px; font-weight: 600; }
  .nrs-create-error { color: var(--pl-danger); font-size: 12.5px; }
  .nrs-create-submit {
    margin: 0 14px 14px; flex-shrink: 0; border: none; background: var(--pl-pink); color: #fff;
    border-radius: 10px; padding: 11px 14px; font-size: 13.5px; font-weight: 700;
  }
  .nrs-create-submit:hover { filter: brightness(1.05); }
  .nrs-create-submit:disabled { opacity: .6; }
</style>
{% endblock %}

{% block screen_class %}nrs{% endblock %}
{% block screen %}
<div class="nrs-tabstrip" id="nrsTabstrip">
  <button type="button" class="nrs-tab-add" id="nrsTabAdd" aria-label="Neuer Tab">+</button>
</div>
<div class="nrs-bar">
  <button type="button" class="nrs-nav-btn" id="nrsBack" disabled aria-label="Zurück">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
  </button>
  <button type="button" class="nrs-nav-btn" id="nrsForward" disabled aria-label="Vorwärts">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
  </button>
  <button type="button" class="nrs-nav-btn" id="nrsReload" aria-label="Neu laden">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
  </button>
  <form class="nrs-address-form" id="nrsForm">
    <input type="text" class="nrs-address" id="nrsAddress" placeholder="Adresse eingeben oder suchen …" autocomplete="off" autocapitalize="none" spellcheck="false">
  </form>
  <button type="submit" form="nrsForm" class="nrs-go-btn">Los</button>
  <a href="#" id="nrsOpenNewTab" class="nrs-nav-btn" hidden target="_blank" rel="noopener" aria-label="Extern in echtem Browser-Tab öffnen" title="Extern in echtem Browser-Tab öffnen">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><path d="M15 3h6v6"/><path d="M10 14 21 3"/></svg>
  </a>
  <button type="button" class="nrs-nav-btn" id="nrsHistoryBtn" aria-label="Verlauf" title="Verlauf">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
  </button>
</div>
<div class="nrs-body" id="nrsBody">
  <button type="button" class="nrs-create-fab" id="nrsCreateFab" aria-label="Mini-Site erstellen" title="Mini-Site erstellen">+</button>
</div>

<div class="nrs-create-backdrop" id="nrsCreateBackdrop"></div>
<div class="nrs-create-modal" id="nrsCreateModal">
  <div class="nrs-create-top">
    <div class="nrs-create-title">Neue Mini-Site</div>
    <button type="button" class="nrs-nav-btn" id="nrsCreateClose" aria-label="Schließen">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 18 18 6M6 6l12 12"/></svg>
    </button>
  </div>
  <div class="nrs-create-body">
    <label for="nrsCreateName">Name</label>
    <input type="text" id="nrsCreateName" placeholder="Meine Seite" maxlength="100">
    <label for="nrsCreateSlug">Domain</label>
    <div class="nrs-create-domain-row">
      <input type="text" id="nrsCreateSlug" placeholder="meine-seite" maxlength="63" autocapitalize="none" spellcheck="false">
      <span>.nrs</span>
    </div>
    <label for="nrsCreateCode">Code (HTML, CSS &amp; JS in einer Datei)</label>
    <textarea id="nrsCreateCode" placeholder="&lt;h1&gt;Hallo Welt&lt;/h1&gt;"></textarea>
    <div class="nrs-create-error" id="nrsCreateError" hidden></div>
  </div>
  <button type="button" class="nrs-create-submit" id="nrsCreateSubmit">Erstellen</button>
</div>

<div class="nrs-history-backdrop" id="nrsHistoryBackdrop"></div>
<aside class="nrs-history-panel" id="nrsHistoryPanel">
  <div class="nrs-history-top">
    <div class="nrs-history-title">Verlauf</div>
    <button type="button" class="nrs-nav-btn" id="nrsHistoryClose" aria-label="Schließen">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 18 18 6M6 6l12 12"/></svg>
    </button>
  </div>
  <div class="nrs-history-list" id="nrsHistoryList"></div>
  <button type="button" class="nrs-history-clear" id="nrsHistoryClear">Verlauf löschen</button>
</aside>
{% endblock %}

{% block scripts %}
<script id="nrsHomeTemplate" type="text/template">
  <div class="nrs-home">
    <span class="nrs-home-mark">{% include "partials/_pinklemon_logo.html" %}</span>
    <h1>NRS</h1>
    <p>Gib oben eine Adresse ein. Manche Seiten lassen sich aus eigenen Sicherheitseinstellungen nicht eingebettet öffnen -- dann hilft der Pfeil-Button oben rechts (extern öffnen). Einzelne Links zu YouTube-Videos, Spotify-Tracks/Playlists und Vimeo-Videos spielen direkt hier ab; die jeweiligen Seiten selbst (Suche, Startseite) nicht. Mit dem "+" unten rechts baust du deine eigene Mini-Site unter einer eigenen "&lt;name&gt;.nrs"-Adresse.</p>
  </div>
</script>
<script src="{{ url_for('static', filename='js/pinklemon-nrs.js') }}"></script>
{% endblock %}
