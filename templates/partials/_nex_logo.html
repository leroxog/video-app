<svg class="brand-logo-mark" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Nex">
    <!-- Thin border, mirroring 7Ai's mark -- a solid white badge would
         otherwise nearly vanish on a white card (this app's light theme,
         still an opt-in option). Fill/text colors stay exactly
         white-bg/black-text as asked; the stroke is purely for
         definition, not a color change. -->
    <rect x="1.5" y="1.5" width="97" height="97" rx="18" fill="#ffffff" stroke="#dddddd" stroke-width="1.5"/>
    <text x="50" y="65" text-anchor="middle" font-family="Arial, 'Segoe UI', sans-serif" font-weight="800" font-size="38" letter-spacing="-1" fill="#000000">Nex</text>
</svg>
