<a class="header-account-avatar" href="{{ url_for('profile', username=user.username) }}" title="Profil"
   {% if not user.profile_image %}style="background:{{ user.username|avatar_color }}"{% endif %}>
    {% if user.profile_image %}
        <img src="{{ media_url('profile_pics', user.profile_image) }}" alt="">
    {% else %}
        <span class="header-account-avatar-placeholder">{{ user.username[0]|upper }}</span>
    {% endif %}
</a>
