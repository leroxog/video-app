         _*_logo.html partials. -->

        <path d="M50 19 L78.6 35.5 L78.6 68.5 L50 85 L21.4 68.5 L21.4 35.5 Z"/>
        <path d="M50 52 L50 19 M50 52 L78.6 35.5 M50 52 L78.6 68.5 M50 52 L50 85 M50 52 L21.4 68.5 M50 52 L21.4 35.5"/>
    </g>
    <g fill="#2f2f2f" stroke="#ffffff" stroke-width="3">
        <circle cx="50" cy="19" r="7.5"/>
        <circle cx="78.6" cy="35.5" r="7.5"/>

        <circle cx="50" cy="85" r="7.5"/>
        <circle cx="21.4" cy="68.5" r="7.5"/>
        <circle cx="21.4" cy="35.5" r="7.5"/>

    <circle cx="50" cy="52" r="4.6" fill="#ffffff"/>
