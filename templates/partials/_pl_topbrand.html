<div class="pl-topbrand-row">
    <div class="pl-topbrand-lockup">
        <a class="pl-topbrand" href="{{ url_for('pl_home') }}" aria-label="HEXAGONUM">
            {% include "partials/_pinklemon_logo.html" %}
            <span class="pl-topbrand-word">HEXAGONUM</span>
        </a>
        {% if user %}
        <button type="button" class="pl-topbrand-origin" id="plTopbrandOrigin"
                data-origin="{{ user.country or '' }}" title="Woher du kommst &auml;ndern">{{ user.country or 'TRY' }}</button>
        {% endif %}
    </div>
    {% if user %}
    <a class="pl-topbrand-me" href="{{ url_for('pl_profile', username=user.username) }}" aria-label="Dein Profil">
        <span class="pl-avatar" style="background:{{ pl_avatar_color(user.username) }}">{% if user.pl_avatar_image %}<img src="{{ _pl_media_url(user.pl_avatar_image) }}" alt="">{% else %}{{ (user.username or '?')[0]|upper }}{% endif %}</span>
    </a>
    {% endif %}
</div>
{% if user %}
<script>
(function () {
    var btn = document.getElementById("plTopbrandOrigin");
    if (!btn || btn.dataset.wired) return;
    btn.dataset.wired = "1";
    btn.addEventListener("click", function () {
        var v = prompt("Woher kommst du? (z.B. DE, AT, CH ...)", btn.dataset.origin || "");
        if (v === null) return;
        v = v.trim().slice(0, 12);
        fetch("/api/pl/profile/origin", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ origin: v }),
        }).then(function (r) { return r.json(); }).then(function (j) {
            if (!j.ok) return;
            btn.dataset.origin = j.origin || "";
            btn.textContent = j.origin || "TRY";
        });
    });
})();
</script>
{% endif %}
