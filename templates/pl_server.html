<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1e1f22">
    <meta name="robots" content="noindex, nofollow">
    <script>try { if (localStorage.getItem("pl_theme") === "light") document.documentElement.setAttribute("data-theme", "light"); } catch (e) {}</script>
    <title>Server · HEXAGONUM</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/pinklemon.css') }}">
    <link rel="icon" href="{{ url_for('static', filename='img/pinklemon-mark.svg') }}" type="image/svg+xml">
</head>
<body>
{%- from "partials/_pl_icons.html" import plicon -%}
<div class="pl-srv-screen" id="plSrvScreen">
    <div class="pl-srv-channels" id="plSrvChannelsCol">
        <div class="pl-srv-side-header">
            <button class="pl-chat-back" onclick="location.href='/'" aria-label="Zurück">&#8592;</button>
            <div class="pl-srv-name" id="plSrvName">&nbsp;</div>
        </div>
        <div class="pl-srv-header-actions">
            <button type="button" id="plSrvInviteBtn">Einladen</button>
            <button type="button" id="plSrvSettingsBtn" hidden>{{ plicon('gear', 15) }} Einstellungen</button>
        </div>
        <div class="pl-srv-channel-list" id="plSrvChannelList"></div>
        <button type="button" class="pl-srv-add-channel" id="plSrvAddChannelBtn" hidden>+ Kanal erstellen</button>
        <button type="button" class="pl-srv-leave" id="plSrvLeaveBtn">Server verlassen</button>
    </div>
    <div class="pl-srv-main" id="plSrvMain">
        <div class="pl-srv-main-header">
            <button class="pl-chat-back pl-srv-mobile-back" id="plSrvMobileBack" aria-label="Zurück">&#8592;</button>
            <span id="plSrvChannelName">#</span>
            <button type="button" class="pl-srv-members-toggle" id="plSrvMembersToggleBtn" aria-label="Mitglieder">{{ plicon('friends', 18) }}</button>
        </div>
        <iframe id="plSrvFrame" class="pl-srv-frame"></iframe>
        <div class="pl-srv-voicepane" id="plSrvVoicePane" hidden></div>
    </div>
    <div class="pl-srv-members" id="plSrvMembersCol">
        <div class="pl-srv-side-header"><div class="pl-srv-name">Mitglieder</div></div>
        <div class="pl-srv-member-list" id="plSrvMemberList"></div>
    </div>
</div>

<!-- invite -->
<div class="pl-sheet-backdrop pl-sheet-modal" id="plSrvInviteSheet">
    <div class="pl-sheet">
        <div class="pl-sheet-grip"></div>
        <div class="pl-sheet-bar">
            <button class="pl-sheet-x" data-close-sheet aria-label="Schließen">&times;</button>
            <h2>Einladen</h2>
            <span></span>
        </div>
        <p style="color:var(--pl-text-dim);font-size:13px;margin:0 0 10px;">Jeder mit diesem Code kann beitreten.</p>
        <div class="pl-srv-invite-code" id="plSrvInviteCode"></div>
        <button class="pl-btn pink" id="plSrvCopyInviteBtn">Code kopieren</button>
    </div>
</div>

<!-- settings: roles + bans -->
<div class="pl-sheet-backdrop pl-sheet-modal" id="plSrvSettingsSheet">
    <div class="pl-sheet">
        <div class="pl-sheet-grip"></div>
        <div class="pl-sheet-bar">
            <button class="pl-sheet-x" data-close-sheet aria-label="Schließen">&times;</button>
            <h2>Rollen</h2>
            <span></span>
        </div>
        <label class="pl-check-inline" style="margin-bottom:14px;">
            <input type="checkbox" id="plSrvPublicToggle"> Server öffentlich (erscheint bei „Könntest du kennen?!“ für neue Accounts)
        </label>
        <div class="pl-srv-role-list" id="plSrvRoleList"></div>
        <div class="pl-srv-new-role">
            <input class="pl-input" id="plSrvNewRoleName" placeholder="Neue Rolle: Name" maxlength="50">
            <button class="pl-btn ghost" id="plSrvAddRoleBtn">Rolle hinzufügen</button>
        </div>
    </div>
</div>

<!-- new channel -->
<div class="pl-sheet-backdrop pl-sheet-modal" id="plSrvNewChannelSheet">
    <div class="pl-sheet">
        <div class="pl-sheet-grip"></div>
        <div class="pl-sheet-bar">
            <button class="pl-sheet-x" data-close-sheet aria-label="Schließen">&times;</button>
            <h2>Kanal erstellen</h2>
            <button class="pl-btn pl-sheet-post" id="plSrvCreateChannelBtn">Erstellen</button>
        </div>
        <div class="pl-srv-chtype-row">
            <button type="button" class="pl-srv-chtype is-active" data-chtype="text">{{ plicon('hashtag', 18) }} Text</button>
            <button type="button" class="pl-srv-chtype" data-chtype="voice">{{ plicon('speaker', 18) }} Sprache</button>
        </div>
        <input class="pl-input" id="plSrvNewChannelName" placeholder="Kanalname" maxlength="50">
        <input class="pl-input" id="plSrvNewChannelCategory" placeholder="Kategorie (optional)" maxlength="80">
    </div>
</div>

<!-- role editor -->
<div class="pl-sheet-backdrop pl-sheet-modal" id="plSrvRoleEditSheet">
    <div class="pl-sheet">
        <div class="pl-sheet-grip"></div>
        <div class="pl-sheet-bar">
            <button class="pl-sheet-x" data-close-sheet aria-label="Schließen">&times;</button>
            <h2 id="plSrvRoleEditTitle">Rolle</h2>
            <button class="pl-danger" id="plSrvDeleteRoleBtn" style="background:none;border:none;">Löschen</button>
        </div>
        <input class="pl-input" id="plSrvRoleEditName" placeholder="Name" maxlength="50">
        <input type="color" id="plSrvRoleEditColor" class="pl-srv-color-input">
        <div class="pl-section-label" style="margin:10px 4px 4px;">Rechte</div>
        <div class="pl-srv-perms" id="plSrvRoleEditPerms"></div>
        <button class="pl-btn pink" id="plSrvSaveRoleBtn" style="margin-top:14px;">Speichern</button>
    </div>
</div>

<div class="pl-toast" id="plToast"></div>
<script>
    window.plToast = function (m) { var t = document.getElementById("plToast"); if (!t) return; t.textContent = m; t.classList.add("show"); clearTimeout(window._plT); window._plT = setTimeout(function () { t.classList.remove("show"); }, 2200); };
    window.PL_SERVER_ID = {{ server_id }};
    window.PL_ME = {{ me_json | tojson }};
</script>
<script src="{{ url_for('static', filename='js/pinklemon-server.js') }}"></script>
</body>
</html>
