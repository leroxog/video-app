<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <script>
    try { if (localStorage.getItem("pl_theme") === "light") document.documentElement.setAttribute("data-theme", "light"); } catch (e) {}
  </script>
  <title>{{ doc.title }} – NRS Suche</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/pinklemon.css') }}">
  <style>
    .sd-top { display: flex; align-items: center; gap: 18px; padding: 14px 22px; border-bottom: 1px solid var(--pl-border); }
    .sd-top a.logo { font-size: 28px; font-weight: 800; letter-spacing: -.03em; color: var(--pl-text); text-decoration: none; }
    .sd-top a.logo span { color: #17b897; }
    .sd-top a.back { font-size: 13.5px; font-weight: 600; color: var(--pl-text-dim); text-decoration: none; }
    .sd-top a.back:hover { color: var(--pl-text); }
    .sd-main { max-width: 700px; margin: 0 auto; padding: 30px 22px 80px; }
    .sd-source { font-size: 12.5px; color: var(--pl-text-faint); margin-bottom: 8px; }
    .sd-main h1 { font-size: clamp(26px, 5vw, 36px); line-height: 1.2; letter-spacing: -.02em; margin: 0 0 18px; color: var(--pl-text); }
    .sd-text { font-size: 16px; line-height: 1.7; color: var(--pl-text-dim); white-space: pre-line; }
    .sd-actions { margin-top: 26px; }
    .sd-actions a {
      display: inline-block; background: #17b897; color: #fff; text-decoration: none; font-weight: 700;
      font-size: 14px; padding: 11px 22px; border-radius: 999px;
    }
    .sd-license { margin-top: 30px; font-size: 12px; color: var(--pl-text-faint); line-height: 1.5; }
    .sd-license a { color: var(--pl-text-dim); }
  </style>
</head>
<body>
<header class="sd-top">
  <a class="logo" href="{{ url_for('pl_search') }}">N<span>RS</span></a>
  <a class="back" href="{{ url_for('pl_search') }}">Zur Suche</a>
</header>
<main class="sd-main">
  <div class="sd-source">{{ doc.url.split("/")[2] }}</div>
  <h1>{{ doc.title }}</h1>
  <div class="sd-text">{{ doc.extract }}</div>
  <div class="sd-actions">
    <a href="{{ doc.url }}" target="_blank" rel="noopener noreferrer">Auf Wikipedia weiterlesen</a>
  </div>
  <p class="sd-license">
    Text aus dem Artikel „{{ doc.title }}“ der <a href="{{ doc.url }}" target="_blank" rel="noopener noreferrer">deutschen Wikipedia</a>,
    verfügbar unter <a href="https://creativecommons.org/licenses/by-sa/4.0/deed.de" target="_blank" rel="noopener noreferrer">CC BY-SA 4.0</a>.
    Die Autoren stehen in der Versionsgeschichte des Artikels.
  </p>
</main>
<script src="{{ url_for('static', filename='js/pinklemon-search.js') }}"></script>
</body>
</html>
