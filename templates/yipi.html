<!doctype html>
<html lang="de" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{ title }}</title>
<meta name="description" content="{{ description }}">
<meta name="theme-color" content="#ffffff">
<meta name="color-scheme" content="dark light">
<link rel="canonical" href="{{ base }}{{ path }}">
<link rel="manifest" href="/manifest.webmanifest">
{%- if private %}
<meta name="robots" content="noindex">
{%- endif %}
<link rel="icon" href="{{ static_url('img/pulse-icon.svg') }}" type="image/svg+xml">
<link rel="icon" href="{{ static_url('img/pulse-192.png') }}" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="{{ static_url('img/pulse-180.png') }}">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Nex">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Nex">
<meta property="og:locale" content="de_DE">
<meta property="og:title" content="{{ title }}">
<meta property="og:description" content="{{ description }}">
<meta property="og:url" content="{{ base }}{{ path }}">
<meta property="og:image" content="{{ base }}/static/img/pulse-og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="preload" href="{{ static_url('fonts/inter-latin-wght-normal.woff2') }}" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="{{ static_url('css/yipi.css') }}">
<style>
.boot { position: fixed; inset: 0; z-index: 2000; display: grid; place-content: center; justify-items: center; gap: 26px; background: var(--bg, #fff); color: var(--text, #000); }
.boot svg { width: 120px; height: 60px; overflow: visible; }
.boot path { fill: none; stroke: currentColor; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 150; stroke-dashoffset: 150; animation: boot-draw 1.3s ease-in-out infinite; }
.boot-name { font: 800 22px/1 var(--font, sans-serif); letter-spacing: -0.03em; animation: boot-fade 1.3s ease-in-out infinite; }
@keyframes boot-draw { 0% { stroke-dashoffset: 150; } 55%, 80% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: -150; } }
@keyframes boot-fade { 0%, 100% { opacity: 0.45; } 55% { opacity: 1; } }
</style>
<noscript><style>.boot { display: none; }</style></noscript>
<script src="{{ static_url('js/yipi-theme.js') }}"></script>
<script defer src="{{ bundle }}"></script>
</head>
<body>
<a class="skip" href="#main">Zum Inhalt springen</a>
<div id="app" class="app">
  <div class="boot" role="status" aria-label="Nex lädt">
    <svg viewBox="0 0 64 32" aria-hidden="true"><path d="M2 17h12l6-13 10 25 8-17 4 5h20"/></svg>
    <span class="boot-name">Nex</span>
  </div>
</div>
<noscript>
  <div class="noscript">
    <h1>Nex</h1>
    <p>Nex braucht JavaScript. Bitte schalte es in deinem Browser ein.</p>
  </div>
</noscript>
<script type="application/json" id="yipiBoot">{{ boot|tojson }}</script>
<script type="application/json" id="yipiAssets">{"matter": "{{ static_url('vendor/matter.min.js') }}", "fruit": "{{ static_url('js/fruit-merge.js') }}", "games": "{{ games }}", "lens": "{{ lens }}", "qr": "{{ static_url('js/vendor/qrcode.js') }}", "jsqr": "{{ static_url('js/vendor/jsqr.js') }}"}</script>
</body>
</html>
